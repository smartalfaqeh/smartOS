name: Bina ISO FaqehOS

on:
  workflow_dispatch:      # tekan "Run workflow" secara manual
  push:
    tags: ["v*"]          # atau tolak tag seperti v0.1

permissions:
  contents: write         # untuk menerbitkan Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Kosongkan ruang cakera
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Bina ISO dalam kontena Debian trixie
        run: docker run --rm --privileged -v "$PWD":/work -w /work debian:trixie bash ./build.sh

      - name: Checksum dan pecah (had Release 2 GB sefail)
        run: |
          ls -lh faqehos*.iso
          sha256sum faqehos.iso > faqehos.iso.sha256
          split -b 1900M -d faqehos.iso faqehos.iso.part-
          ls -lh faqehos.iso.part-*

      - name: Simpan log bina
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Terbitkan Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: FaqehOS ISO (bina #${{ github.run_number }})
          body: |
            Muat turun SEMUA fail `faqehos.iso.part-*` dan `faqehos.iso.sha256`, kemudian gabungkan:
            - Linux/Mac: `cat faqehos.iso.part-* > faqehos.iso && sha256sum -c faqehos.iso.sha256`
            - Windows (cmd): `copy /b faqehos.iso.part-00+faqehos.iso.part-01+faqehos.iso.part-02 faqehos.iso`
              (sertakan semua bahagian mengikut urutan)
          files: |
            faqehos.iso.part-*
            faqehos.iso.sha256
